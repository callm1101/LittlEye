name: Cross-platform build

on:
  release:
    types: [published]

jobs:
  bundle:
    name: ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundle: app
            artifacts: src-tauri/target/release/bundle/macos/*.app
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-22.04
            bundle: appimage,deb,rpm
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: littleye-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
